server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Proxy API requests to qBittorrent (via gluetun)
    # The trailing slash on both sides is critical!
    location /api/ {
        # Using the internal Docker DNS name and port
        proxy_pass http://gluetun:8080/api/;
        
        # Pass headers to maintain the session
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Prevent Nginx from caching API responses
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # 2. Essential for React/PWA routing (catch-all for the frontend)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. Cache optimization for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}